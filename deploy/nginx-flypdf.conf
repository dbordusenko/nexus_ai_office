# FlyPDF — nginx reverse proxy
# Serves the static frontend and proxies /api/* to the Node backend on :8001.
# Place at /etc/nginx/sites-available/flypdf and symlink into sites-enabled.
# Replace YOUR_DOMAIN with your real domain (needed for Let's Encrypt HTTPS).

server {
    listen 80;
    server_name YOUR_DOMAIN;

    # Static frontend (the single-file prototype)
    root /opt/flypdf/FlyPDF/preview;
    index index.html;

    # Allow larger uploads for email attachments / PDFs (default is 1MB)
    client_max_body_size 25m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls to the Node backend. The frontend calls `${origin}/api/...`,
    # so we strip the /api prefix before forwarding.
    location /api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming (AI chat SSE) needs buffering off
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}

# After running certbot (see DEPLOY.md), it will add a TLS server block here
# automatically and redirect :80 → :443.
